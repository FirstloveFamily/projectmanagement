services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FOLDER_PROJECT_NAME}_app_image
    container_name: ${FOLDER_PROJECT_NAME}_app
    restart: unless-stopped
    ports:
      - "9000"
    working_dir: /usr/share/nginx/html/${FOLDER_PROJECT_NAME}
    volumes:
      - .:/usr/share/nginx/html/${FOLDER_PROJECT_NAME}
    command: >
      sh -c "
        echo '🔐 Preparing environment...' &&
        git config --global --add safe.directory '*' &&
        mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache &&
        chown -R vcst:www-data storage bootstrap/cache || true &&
        chmod -R 775 storage bootstrap/cache || true &&
        
        if [ ! -d \"vendor\" ]; then
            echo '📦 Installing PHP dependencies...' &&
            composer install --no-interaction --optimize-autoloader;
        fi &&
        
        if [ ! -d \"node_modules\" ] && [ -f package.json ]; then
            echo '🍞 Installing JS dependencies...' &&
            bun install &&
            echo '⚡ Building assets...' &&
            bun run build;
        fi &&
        
        echo '🛠️ Setting up Laravel for environment: $APP_ENV' &&
        php artisan storage:link --force || true &&

        if [ \"$APP_ENV\" = \"production\" ] || [ \"$APP_ENV\" = \"prod\" ]; then
            echo '🚀 Production mode: Optimizing for performance...' &&
            php artisan optimize &&
            php artisan filament:optimize &&
            php artisan filament:assets &&
            sed -i 's/opcache.validate_timestamps=[0-9]/opcache.validate_timestamps=0/g' /usr/local/etc/php/conf.d/docker-php.ini;
        else
            echo '🛠️ Development mode: Clearing cache for hot-reload...' &&
            php artisan optimize:clear &&
            php artisan filament:optimize-clear;
        fi &&
        
        echo '✅ Ready to go!' &&
        php-fpm -F
      "
    env_file:
      - .env
    environment:
      COMPOSER_PROCESS_TIMEOUT: 2000
    networks:
      - itc-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FOLDER_PROJECT_NAME}_app_image
    deploy:
      replicas: 2
    # container_name: ${FOLDER_PROJECT_NAME}_worker
    restart: unless-stopped
    working_dir: /usr/share/nginx/html/${FOLDER_PROJECT_NAME}
    volumes:
      - .:/usr/share/nginx/html/${FOLDER_PROJECT_NAME}
    depends_on:
      - app
    command: >
      sh -c "
        until [ -f vendor/autoload.php ]; do
          echo 'Waiting for composer install...';
          sleep 5;
        done;
        echo '📦 Composer dependencies found. Waiting for system setup...';
        sleep 10;
        echo '🚀 Starting worker...';
        php artisan queue:work --verbose --tries=3 --timeout=180
      "
    env_file:
      - .env
    networks:
      - itc-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FOLDER_PROJECT_NAME}_app_image
    container_name: ${FOLDER_PROJECT_NAME}_scheduler
    restart: unless-stopped
    working_dir: /usr/share/nginx/html/${FOLDER_PROJECT_NAME}
    volumes:
      - .:/usr/share/nginx/html/${FOLDER_PROJECT_NAME}
    depends_on:
      - app
    command: >
      sh -c "
        until [ -f vendor/autoload.php ]; do
          sleep 5;
        done;
        sleep 10;
        echo '⏰ Starting scheduler...';
        php artisan schedule:clear-cache;
        while [ true ]; do
          php artisan schedule:run --no-interaction &
          sleep 60;
        done
      "
    env_file:
      - .env
    environment:
      TZ: Asia/Bangkok
    networks:
      - itc-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:stable-alpine
    container_name: ${FOLDER_PROJECT_NAME}_nginx
    restart: unless-stopped
    ports:
      - "80"
    volumes:
      - .:/usr/share/nginx/html/${FOLDER_PROJECT_NAME}
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      - FOLDER_PROJECT_NAME=${FOLDER_PROJECT_NAME}
    depends_on:
      - app
    networks:
      - itc-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  itc-network:
    external: true
    name: itc-network