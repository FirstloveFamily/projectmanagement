; ตัวอย่างการตั้งค่าสำหรับ Container ที่มี RAM พอสมควร (เช่น 1-2GB ต่อ Container)
[www]
pm = dynamic
pm.max_children = 50       ; จำนวน Process สูงสุดที่ยอมให้สร้าง (แก้ปัญหาคอขวด)
pm.start_servers = 10      ; สร้าง Process รอไว้เลยตอน Start container
pm.min_spare_servers = 5   ; จำนวน Process ว่างขั้นต่ำที่ต้องมี standby เสมอ
pm.max_spare_servers = 20  ; จำนวน Process ว่างสูงสุด (ถ้าเกินจะโดน kill ทิ้งเพื่อคืน RAM)
pm.max_requests = 500      ; ให้ Restart child process เมื่อรันครบ 500 request (ป้องกัน Memory Leak)
