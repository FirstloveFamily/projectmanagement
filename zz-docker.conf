; Optimized PHP-FPM configuration for high performance
[www]
pm = dynamic
pm.max_children = 50       ; Maximum number of child processes
pm.start_servers = 15      ; Number of child processes created on startup
pm.min_spare_servers = 10  ; Minimum number of idle child processes
pm.max_spare_servers = 30  ; Maximum number of idle child processes
pm.max_requests = 1000     ; Restart child process after 1000 requests to prevent memory leaks

; Logging
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
