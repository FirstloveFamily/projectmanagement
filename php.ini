memory_limit = 4G
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300

[opcache]
opcache.enable=1
opcache.memory_consumption=512
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000 ; Laravel ไฟล์เยอะ ต้องตั้งค่านี้ให้สูงระดับหมื่น
opcache.validate_timestamps=1       ; ถ้าเป็นเซิร์ฟเวอร์ Production ให้ปรับเป็น 0 เพื่อความเร็วสูงสุด Development ให้ปรับเป็น 1